experiment:
  task: severe_post_earthquake_building_damage_segmentation
  input_size: [256, 256]
  modalities:
    - pre_event_optical_rgb
    - post_event_optical_rgb
    - post_event_sar_intensity

training:
  total_samples: 500000
  batch_size: 16
  evaluation_batch_size: 8
  warmup_steps: 800
  learning_rate: 0.0001
  weight_decay: 0.01
  validation_interval_steps: 300
  checkpoint_metric: validation_damage_iou
  sar_modality_dropout_probability: 0.2
  default_seed: 42

optimisation:
  optimizer: AdamW
  scheduler: ReduceLROnPlateau
  scheduler_factor: 0.8
  scheduler_patience_evaluations: 6
  minimum_learning_rate: 0.000001
  ema_decay: 0.999

evaluation:
  threshold: 0.5
  test_time_augmentation:
    horizontal_flip: true
    vertical_flip: true
    rotations_degrees: [0, 90, 180, 270]
  synthetic_cloud_application_probability: 0.3
  synthetic_cloud_base_seed: 25

splits:
  train: splits/train.txt
  validation: splits/val.txt
  test: splits/test.txt

